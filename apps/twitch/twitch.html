<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twitch | SXI Phone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="twitch.css">
  <link rel="stylesheet" href="../scripts/app-appearance-settings.css">
</head>
<body>
  <div class="twitch-app">
    <!-- 頂部導航 -->
    <header class="top-nav">
      <div class="nav-left">
        <button class="nav-btn" id="backBtn" aria-label="返回">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <button class="nav-btn" id="menuBtn" aria-label="選單">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
          </svg>
        </button>
      </div>
      <div class="nav-logo">
        <img
          class="twitch-logo-img"
          src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg"
          alt="Twitch Logo"
        >
        <span class="twitch-logo-wordmark">Twitch</span>
      </div>
      <div class="nav-actions">
        <button class="nav-btn" id="appearance-btn" aria-label="外觀設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </button>
        <button class="nav-btn search-btn" id="searchBtn" aria-label="搜尋">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
        <div class="user-avatar" id="userAvatar">
          <img src="https://placehold.co/32x32/9146ff/ffffff?text=U" alt="用戶頭像">
        </div>
      </div>
    </header>

    <!-- 側邊欄 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-title">推薦頻道</h3>
        <div class="channel-list" id="recommendedChannels">
          <!-- 由 JS 動態生成 -->
        </div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-title">追蹤的頻道</h3>
        <div class="channel-list" id="followedChannels">
          <!-- 由 JS 動態生成 -->
        </div>
      </div>
      <button class="sidebar-more" id="showMoreBtn">顯示更多</button>
    </aside>

    <!-- 主內容區 -->
    <main class="main-content">
      <!-- 分類標籤 -->
      <div class="category-nav">
        <select class="category-select" id="categorySelect">
          <option value="all">全部</option>
          <option value="gaming">遊戲</option>
          <option value="irl">生活</option>
          <option value="music">音樂</option>
          <option value="esports">電競</option>
          <option value="creative">創作</option>
        </select>
        <button class="category-add-btn" id="addCategoryBtn" aria-label="新增分類">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
      </div>

      <!-- 輪播區域 -->
      <section class="featured-section">
        <div class="featured-carousel" id="featuredCarousel">
          <!-- 由 JS 動態生成 -->
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
      </section>

      <!-- 直播列表 -->
      <section class="streams-section">
        <div class="section-header">
          <h2 class="section-title">為你推薦的直播</h2>
          <button class="sort-btn" id="sortBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/>
            </svg>
            排序
          </button>
        </div>
        <div class="streams-grid" id="streamsGrid">
          <!-- 由 JS 動態生成 -->
        </div>
      </section>

      <!-- 分類瀏覽 -->
      <section class="categories-section">
        <div class="section-header">
          <h2 class="section-title">瀏覽分類</h2>
          <a href="#" class="see-all">查看全部</a>
        </div>
        <div class="categories-grid" id="categoriesGrid">
          <!-- 由 JS 動態生成 -->
        </div>
      </section>
    </main>

    <!-- 底部導航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>首頁</span>
      </button>
      <button class="nav-item" data-tab="browse">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span>瀏覽</span>
      </button>
      <button class="nav-item" data-tab="following">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>追蹤</span>
      </button>
      <button class="nav-item" data-tab="notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
        </svg>
        <span>通知</span>
      </button>
    </nav>

    <!-- 搜尋面板 -->
    <div class="search-panel" id="searchPanel">
      <div class="search-header">
        <button class="back-btn" id="closeSearchBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="搜尋頻道或遊戲">
        </div>
      </div>
      <div class="search-results" id="searchResults">
        <div class="search-history">
          <h3>搜尋紀錄</h3>
          <div class="history-list" id="historyList">
            <!-- 由 JS 動態生成 -->
          </div>
        </div>
        <div class="trending-searches">
          <h3>熱門搜尋</h3>
          <div class="trending-list" id="trendingList">
            <!-- 由 JS 動態生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 直播詳情頁面 -->
    <div class="stream-page" id="streamPage">
      <div class="stream-header">
        <button class="back-btn" id="closeStreamBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <div class="stream-info-header">
          <span class="streamer-name" id="streamerName">實況主名稱</span>
          <span class="stream-category" id="streamCategory">遊戲分類</span>
        </div>
        <button class="follow-btn" id="followBtn">追蹤</button>
      </div>
      <div class="stream-player">
        <div class="video-placeholder" id="videoPlaceholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="stream-controls">
          <button class="control-btn" id="playBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <button class="control-btn" id="fullscreenBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="stream-tabs">
        <button class="stream-tab active" data-tab="chat">聊天室</button>
        <button class="stream-tab" data-tab="info">資訊</button>
      </div>
      <div class="stream-content">
        <div class="chat-panel" id="chatPanel">
          <div class="chat-messages" id="chatMessages">
            <!-- 由 JS 動態生成 -->
          </div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="傳送訊息">
            <button class="send-btn" id="sendChatBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="info-panel" id="infoPanel" style="display: none;">
          <div class="streamer-card">
            <img class="streamer-avatar" id="streamerAvatar" src="" alt="">
            <div class="streamer-details">
              <h3 id="streamerTitle">實況主名稱</h3>
              <p id="streamerBio">實況主簡介</p>
              <div class="streamer-stats">
                <span id="viewerCount">0 位觀眾</span>
                <span id="followerCount">0 位追蹤者</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/shared-settings.js"></script>
<script src="../scripts/app-appearance-settings.js"></script>
<script src="../scripts/app-appearance-configs.js"></script>
<script src="twitch.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
      if (typeof SxAppAppearance !== 'undefined') {
          SxAppAppearance.initAppearanceForApp('twitch');
          var appearanceBtn = document.getElementById('appearance-btn');
          if (appearanceBtn) {
              appearanceBtn.addEventListener('click', function() {
                  SxAppAppearance.openAppearancePanel('twitch', document.body, function() {
                      var panel = document.getElementById('sx-app-appearance-panel');
                      if (panel) panel.remove();
                  });
              });
          }
      }
  });
  </script>
</body>
</html>
