<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../scripts/app-appearance-settings.css">
  <link rel="stylesheet" href="../scripts/nds-pixel-theme.css">
  <script src="../scripts/nds-pixel-theme.js"></script>
</head>
<body>
  <div class="home-app" id="home-app">
    <div id="intro-overlay" class="intro-overlay">
      <div class="intro-card">
        <div class="intro-title">HOME WORLD</div>
        <div class="intro-sub">Nintendo DS Pixel Life</div>
      </div>
    </div>

    <div id="fade-layer" class="fade-layer hidden"></div>

    <div id="world-view" class="view active">
      <canvas id="world-canvas"></canvas>

      <div class="world-hud-top">
        <button id="btn-back" class="hud-btn" onclick="window.parent?.postMessage({type:'closeApp'}, '*')"><i class="fas fa-chevron-left"></i></button>
        <div class="hud-region" id="hud-region">住宅區</div>
        <div class="hud-money">G <span id="hud-balance">0</span></div>
        <button id="btn-map" class="hud-btn">MAP</button>
        <button id="btn-menu" class="hud-btn"><i class="fas fa-bars"></i></button>
      </div>

      <canvas id="minimap-canvas" class="minimap" width="120" height="84"></canvas>
      <div id="region-banner" class="region-banner hidden"></div>

      <div id="joystick" class="joystick">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
      <button id="btn-action" class="game-btn btn-a hidden">A</button>
      <button id="btn-run" class="game-btn btn-b">B</button>

      <div id="dialogue-container" class="dialogue-container hidden"></div>
    </div>

    <div id="room-view" class="view hidden">
      <div class="room-top-bar">
        <button id="btn-room-back" class="hud-btn">BACK</button>
        <div class="room-title" id="room-title">ROOM</div>
        <button id="btn-room-edit" class="hud-btn">EDIT</button>
      </div>
      <div id="room-tabs" class="room-tabs"></div>
      <div class="room-game-area">
        <div class="room-controls-left">
          <div id="room-joystick" class="joystick">
            <div class="joystick-ring"></div>
            <div id="room-joystick-knob" class="joystick-knob"></div>
          </div>
        </div>
        <div class="room-canvas-wrapper"><canvas id="room-canvas" width="480" height="400"></canvas></div>
        <div class="room-controls-right">
          <button id="btn-room-action" class="game-btn btn-a hidden">A</button>
        </div>
      </div>
      <div class="room-toolbar">
        <button id="btn-room-store" class="hud-btn">SHOP</button>
        <button id="btn-room-save" class="hud-btn">SAVE</button>
      </div>
    </div>

    <div id="teleport-overlay" class="overlay hidden">
      <div class="teleport-map-container">
        <div class="teleport-header">
          <span>WORLD MAP</span>
          <button id="btn-close-teleport" class="hud-btn">X</button>
        </div>
        <canvas id="teleport-map-canvas" width="400" height="300"></canvas>
        <div class="teleport-info" id="teleport-info">選擇已解鎖區域傳送</div>
      </div>
    </div>

    <div id="buy-modal" class="overlay hidden">
      <div class="modal-card">
        <div class="modal-title">房產購買</div>
        <canvas id="buy-preview" width="160" height="96"></canvas>
        <div id="buy-name" class="modal-line">---</div>
        <div id="buy-price" class="modal-line">G 0</div>
        <div class="modal-actions">
          <button id="btn-buy-confirm" class="hud-btn">BUY</button>
          <button id="btn-buy-cancel" class="hud-btn">CANCEL</button>
        </div>
      </div>
    </div>

    <div id="shop-modal" class="overlay hidden">
      <div class="modal-card wide">
        <div class="modal-title">家具商店</div>
        <div id="shop-list" class="shop-list"></div>
        <div class="modal-actions"><button id="btn-shop-close" class="hud-btn">CLOSE</button></div>
      </div>
    </div>

    <div id="pin-modal" class="overlay hidden">
      <div class="modal-card">
        <div class="modal-title">PIN 驗證</div>
        <input id="pin-input" class="pin-input" type="password" maxlength="6" inputmode="numeric" placeholder="輸入 1234">
        <div class="modal-actions">
          <button id="btn-pin-confirm" class="hud-btn">OK</button>
          <button id="btn-pin-cancel" class="hud-btn">CANCEL</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="overlay hidden">
      <div class="modal-card">
        <div class="modal-title">系統設定</div>
        <div class="modal-line">WASD / 方向鍵移動</div>
        <div class="modal-line">Z / 空白互動、B 奔跑、M 地圖</div>
        <div class="modal-actions"><button id="btn-settings-close" class="hud-btn">CLOSE</button></div>
      </div>
    </div>

    <div id="mirror-modal" class="overlay hidden">
      <div class="modal-card wide">
        <div class="modal-title">穿衣鏡 - 更換外觀</div>
        <div class="mirror-preview">
          <canvas id="mirror-preview-canvas" width="64" height="64"></canvas>
        </div>
        <div id="mirror-presets" class="mirror-presets"></div>
        <div class="mirror-upload">
          <label for="mirror-file-input" class="hud-btn">上傳自訂圖片</label>
          <input type="file" id="mirror-file-input" accept="image/*" class="hidden">
        </div>
        <div class="modal-actions">
          <button id="btn-mirror-apply" class="hud-btn">APPLY</button>
          <button id="btn-mirror-close" class="hud-btn">CLOSE</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/shared-settings.js"></script>
  <script src="../scripts/app-appearance-settings.js"></script>
  <script src="../scripts/app-appearance-configs.js"></script>
  <script src="home-data.js"></script>
  <script src="home-dialogue.js"></script>
  <script src="home-map-engine.js"></script>
  <script src="home-indoor.js"></script>
  <script src="home-player.js"></script>
  <script src="home-building.js"></script>
  <script src="home-teleport.js"></script>
  <script src="home.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof SxAppAppearance !== 'undefined') {
        SxAppAppearance.initAppearanceForApp('home');
      }
    });
  </script>
</body>
</html>
