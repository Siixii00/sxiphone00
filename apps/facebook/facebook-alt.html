<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臉書（小帳）</title>
  <link rel="stylesheet" href="facebook.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="fb-app">
    <header class="fb-topbar">
      <div class="topbar-left">
        <button class="icon-btn" aria-label="返回" onclick="window.parent?.postMessage({type:'closeApp'}, '*')">
          <i class="fas fa-chevron-left"></i>
        </button>
        <div class="fb-logo">
          <i class="fab fa-facebook-f"></i>
        </div>
      </div>
      <div class="topbar-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="搜尋 Facebook" aria-label="搜尋 Facebook">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="建立"><i class="fas fa-plus"></i></button>
        <button class="icon-btn" aria-label="Messenger"><i class="fab fa-facebook-messenger"></i></button>
        <button class="icon-btn" aria-label="通知"><i class="far fa-bell"></i></button>
        <button class="profile-entry-btn" id="profile-entry-btn" aria-label="個人頁面設定">
          <div class="avatar-sm profile-avatar-bind"></div>
        </button>
      </div>
    </header>

    <main class="fb-layout">
      <aside class="fb-sidebar">
        <div class="sidebar-section">
          <button class="nav-item active"><div class="avatar-sm"></div><span>你的動態消息</span></button>
          <button class="nav-item"><i class="fas fa-user-friends"></i><span>朋友</span></button>
          <button class="nav-item"><i class="fas fa-users"></i><span>社團</span></button>
          <button class="nav-item"><i class="fas fa-store"></i><span>Marketplace</span></button>
          <button class="nav-item"><i class="fas fa-clock"></i><span>回憶</span></button>
          <button class="nav-item"><i class="far fa-bookmark"></i><span>已儲存</span></button>
        </div>
        <div class="sidebar-section">
          <div class="section-title">捷徑</div>
          <button class="nav-item"><i class="fas fa-flag"></i><span>粉絲專頁</span></button>
          <button class="nav-item"><i class="fas fa-calendar-check"></i><span>活動</span></button>
          <button class="nav-item"><i class="fas fa-gamepad"></i><span>遊戲</span></button>
        </div>
      </aside>

      <section class="fb-feed">
        <div class="stories card">
          <div class="stories-track">
            <div class="story create">
              <div class="story-bg"></div>
              <div class="story-add"><i class="fas fa-plus"></i></div>
              <div class="story-label">建立限時動態</div>
            </div>
            <div class="story" data-name="Emily">
              <div class="story-bg"></div>
              <div class="story-avatar"></div>
              <div class="story-label">Emily</div>
            </div>
            <div class="story" data-name="Leo">
              <div class="story-bg"></div>
              <div class="story-avatar"></div>
              <div class="story-label">Leo</div>
            </div>
            <div class="story" data-name="UI Lab">
              <div class="story-bg"></div>
              <div class="story-avatar"></div>
              <div class="story-label">UI Lab</div>
            </div>
          </div>
        </div>

        <section class="composer card">
          <div class="composer-row">
            <div class="avatar profile-avatar-bind"></div>
            <textarea id="post-input" placeholder="想說些什麼？" readonly></textarea>
          </div>
        </section>

        <section class="feed" id="feed"></section>
      </section>

      <aside class="fb-right">
        <div class="card">
          <div class="section-title">贊助內容</div>
          <div class="sponsored-item">
            <div class="thumb"></div>
            <div>
              <div class="title">前端 UI Lab</div>
              <div class="link">uilab.dev</div>
            </div>
          </div>
          <div class="sponsored-item">
            <div class="thumb alt"></div>
            <div>
              <div class="title">設計靈感刊</div>
              <div class="link">designshot.app</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">生日</div>
          <p class="muted">今天有 2 位朋友生日</p>
        </div>

        <div class="card contacts">
          <div class="section-title">聯絡人</div>
          <div class="contact"><div class="avatar-sm online"></div><span>Olivia</span></div>
          <div class="contact"><div class="avatar-sm online"></div><span>Kevin</span></div>
          <div class="contact"><div class="avatar-sm"></div><span>Wendy</span></div>
          <div class="contact"><div class="avatar-sm"></div><span>Ray</span></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="compose-modal hidden" id="compose-modal" role="dialog" aria-modal="true" aria-label="建立貼文">
    <div class="compose-sheet card">
      <div class="compose-header">
        <button class="icon-btn" id="compose-close" aria-label="關閉"><i class="fas fa-xmark"></i></button>
        <h3>建立貼文</h3>
        <button class="primary-btn" id="post-btn" type="button">發布</button>
      </div>
      <div class="composer-row">
        <div class="avatar profile-avatar-bind"></div>
        <textarea id="compose-input" placeholder="想說些什麼？"></textarea>
      </div>
      <div class="composer-actions">
        <button class="action-btn" type="button"><i class="far fa-image"></i><span>照片 / 影片</span></button>
        <button class="action-btn" type="button"><i class="fas fa-user-tag"></i><span>標註朋友</span></button>
        <button class="action-btn" type="button"><i class="far fa-face-smile"></i><span>感受 / 活動</span></button>
      </div>
    </div>
  </div>

  <script src="facebook-alt.js"></script>
</body>
</html>
