<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>番茄鐘</title>
  <link rel="stylesheet" href="pomodoro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../scripts/app-appearance-settings.css">
</head>
<body class="dark-mode">
  <div class="page active">
    <header class="ios-header">
      <button class="ios-back-btn" id="back-btn" aria-label="返回" onclick="window.parent?.postMessage({type:'closeApp'}, '*')">
        <i class="fas fa-chevron-left"></i> 返回
      </button>
      <div class="menu-title">番茄鐘</div>
      <button class="ghost icon-btn" id="settings-btn" aria-label="設定">
        <i class="fas fa-gear"></i>
      </button>
    </header>

    <section class="pomodoro-panel">
      <div class="mode-tabs" id="mode-tabs">
        <button data-mode="focus" class="tab active">專注</button>
        <button data-mode="short" class="tab">短休</button>
        <button data-mode="long" class="tab">長休</button>
      </div>

      <div class="time-display" id="time-display">25:00</div>
      <div class="status" id="status">Ready</div>

      <div class="actions">
        <button class="primary" id="start-btn">開始</button>
        <button class="ghost secondary" id="reset-btn">重置</button>
      </div>

      <div class="stats">
        <div>
          <div class="stat-label">今日完成</div>
          <div class="stat-value" id="completed-count">0</div>
        </div>
        <div>
          <div class="stat-label">循環</div>
          <div class="stat-value" id="cycle-info">1 / 4</div>
        </div>
      </div>
    </section>

    <section class="pomodoro-panel">
      <div class="panel-title">夥伴角色</div>
      <div class="companion-card" id="companion-card">
        <div class="companion-avatar" id="companion-avatar"></div>
        <div class="companion-body">
          <div class="companion-name" id="companion-name">夥伴角色</div>
          <div class="companion-line" id="companion-line">開始後會定時給你鼓勵</div>
        </div>
      </div>
      <div class="companion-bubble hidden" id="companion-bubble"></div>
      <div class="companion-actions">
        <button class="ghost" id="upload-avatar-btn">上傳夥伴頭像</button>
        <input type="file" id="companion-upload" accept="image/*" hidden>
      </div>
    </section>

    <section class="panel hidden" id="settings-panel">
      <div class="panel-header">
        <div>設定</div>
        <button class="ghost" id="close-settings"><i class="fas fa-times"></i></button>
      </div>

      <div class="panel-grid">
        <label>專注 (分鐘)
          <input type="number" id="focus-min" min="1" max="90" value="25">
        </label>
        <label>短休 (分鐘)
          <input type="number" id="short-min" min="1" max="30" value="5">
        </label>
        <label>長休 (分鐘)
          <input type="number" id="long-min" min="1" max="60" value="15">
        </label>
        <label>長休間隔 (組數)
          <input type="number" id="long-gap" min="1" max="12" value="4">
        </label>
        <label>夥伴對話間隔 (分鐘)
          <input type="number" id="companion-interval" min="1" max="30" value="5">
        </label>
      </div>

      <div class="panel-divider"></div>
      <button class="ghost appearance-settings-btn" id="appearance-settings-btn" type="button">
        <i class="fas fa-palette"></i> 外觀設定
      </button>

      <div class="panel-actions">
        <button class="primary" id="save-settings">儲存設定</button>
      </div>
    </section>
  </div>
  <script src="pomodoro.js"></script>
  <script src="../scripts/shared-settings.js"></script>
  <script src="../scripts/app-appearance-settings.js"></script>
  <link rel="stylesheet" href="../scripts/app-appearance-settings.css">
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof SxAppAppearance !== 'undefined') {
        SxAppAppearance.initAppearanceForApp('pomodoro');
        var appearanceBtn = document.getElementById('appearance-settings-btn');
        if (appearanceBtn) {
          appearanceBtn.addEventListener('click', function() {
            SxAppAppearance.openAppearancePanel('pomodoro', document.body, function() {
              var panel = document.getElementById('sx-app-appearance-panel');
              if (panel) panel.remove();
            });
          });
        }
      }
    });
  </script>
</body>
</html>
