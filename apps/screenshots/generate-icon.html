<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>生成 PWA 图标</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        canvas {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #FF6B9D, #00B4D8);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,107,157,0.4);
        }
        .preview-row {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-item {
            text-align: center;
        }
        .preview-item canvas {
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .preview-item p {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 PWA 图标生成器</h1>
        <p style="color: #aaa; margin-bottom: 20px;">SEVENTEEN 应援色渐变 + S 字母</p>
        
        <canvas id="canvas512" width="512" height="512"></canvas>
        
        <div class="buttons">
            <button onclick="downloadPNG(512)">下载 512x512 PNG</button>
            <button onclick="downloadPNG(192)">下载 192x192 PNG</button>
            <button onclick="downloadSVG()">下载 SVG</button>
        </div>
        
        <div class="preview-row">
            <div class="preview-item">
                <canvas id="canvas192" width="192" height="192"></canvas>
                <p>192x192</p>
            </div>
            <div class="preview-item">
                <canvas id="canvas96" width="96" height="96"></canvas>
                <p>96x96</p>
            </div>
            <div class="preview-item">
                <canvas id="canvas72" width="72" height="72"></canvas>
                <p>72x72</p>
            </div>
            <div class="preview-item">
                <canvas id="canvas48" width="48" height="48"></canvas>
                <p>48x48</p>
            </div>
        </div>
    </div>

    <script>
        // SEVENTEEN 应援色渐变
        const gradientColors = ['#FF6B9D', '#FF8FB1', '#00B4D8'];
        
        function drawIcon(ctx, size) {
            const scale = size / 512;
            
            // 清空画布
            ctx.clearRect(0, 0, size, size);
            
            // 绘制圆角矩形背景
            const radius = 96 * scale;
            const padding = 32 * scale;
            
            ctx.beginPath();
            ctx.roundRect(padding, padding, size - padding * 2, size - padding * 2, radius);
            
            // 创建渐变
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#FF6B9D');
            gradient.addColorStop(0.5, '#FF8FB1');
            gradient.addColorStop(1, '#00B4D8');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 绘制 S 字母
            ctx.fillStyle = '#ffffff';
            ctx.font = `700 ${300 * scale}px "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 添加阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
            ctx.shadowBlur = 20 * scale;
            ctx.shadowOffsetY = 4 * scale;
            
            ctx.fillText('S', size / 2, size / 2 + 20 * scale);
            
            // 重置阴影
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }
        
        // 绘制所有尺寸
        function drawAll() {
            const sizes = [512, 192, 96, 72, 48];
            sizes.forEach(s => {
                const canvas = document.getElementById(`canvas${s}`);
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    drawIcon(ctx, s);
                }
            });
        }
        
        // 下载 PNG
        function downloadPNG(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            drawIcon(ctx, size);
            
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // 下载 SVG
        function downloadSVG() {
            const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="seventeen-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="50%" style="stop-color:#FF8FB1"/>
      <stop offset="100%" style="stop-color:#00B4D8"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#seventeen-gradient)"/>
  <text x="256" y="340" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="300" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
</svg>`;
            
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'icon.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
        }
        
        // 页面加载时绘制
        drawAll();
    </script>
</body>
</html>
