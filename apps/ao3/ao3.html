<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO3 行動寫作工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ao3.css">
    <link rel="stylesheet" href="../scripts/app-appearance-settings.css">
</head>
<body>
    <div class="ao3-shell">
        <header class="ao3-topbar">
            <button type="button" class="topbar-btn" id="ao3-close" aria-label="返回主畫面">←</button>
            <div class="logo">
                <span class="wordmark">Archive of Our Own</span>
                <span class="beta">β</span>
            </div>
            <button type="button" class="topbar-btn" id="ao3-menu" aria-label="使用者選單">☰</button>
            <div class="menu-dropdown hidden" id="ao3-menu-dropdown">
                <button type="button" class="menu-item" id="menu-appearance"><i class="fas fa-palette"></i> 外觀設定</button>
                <button type="button" class="menu-item" id="menu-export-txt">匯出為 TXT</button>
                <button type="button" class="menu-item" id="menu-export-md">匯出為 Markdown</button>
                <button type="button" class="menu-item" id="menu-import">匯入草稿</button>
                <button type="button" class="menu-item" id="menu-clear-form">清空表單</button>
                <hr class="menu-divider">
                <button type="button" class="menu-item" id="menu-help">使用說明</button>
            </div>
        </header>

        <nav class="ao3-nav" aria-label="AO3 導覽">
            <button class="nav-link active" type="button">Works</button>
            <button class="nav-link" type="button">Bookmarks</button>
            <button class="nav-link" type="button">Collections</button>
            <button class="nav-link" type="button">My Works</button>
        </nav>

        <section class="form-card" aria-label="作品基本資訊">
            <div class="field">
                <label for="work-title">作品標題</label>
                <input id="work-title" type="text" placeholder="請輸入標題 (必填)">
            </div>
            <div class="field-grid">
                <label>
                    <span>作品分級</span>
                    <select id="work-rating">
                        <option value="G">General Audiences</option>
                        <option value="T">Teen & Up</option>
                        <option value="M">Mature</option>
                        <option value="E">Explicit</option>
                        <option value="NR">Not Rated</option>
                    </select>
                </label>
                <label>
                    <span>主要語言</span>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="zh-Hant">繁體中文</option>
                        <option value="zh-Hans">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                    </select>
                </label>
            </div>
            <div class="field">
                <label>附加語言 (可多選)</label>
                <div class="language-grid" id="language-grid"></div>
            </div>
            <div class="field">
                <label for="work-summary">摘要</label>
                <textarea id="work-summary" rows="3" placeholder="用數句話描述作品內容，支援多語言敘述"></textarea>
            </div>
            <div class="field">
                <label for="work-notes">作者前言 / 備註</label>
                <textarea id="work-notes" rows="2" placeholder="Optional: notes, warnings 或翻譯說明"></textarea>
            </div>
        </section>

        <section class="tag-card" aria-label="標籤欄位">
            <h3>Tags</h3>
            <div class="tag-field" data-type="fandom">
                <div class="tag-field-header">
                    <label>Fandoms</label>
                    <span>最多 20 個</span>
                </div>
                <div class="tag-input">
                    <div class="tag-chip-list" id="tags-fandom"></div>
                    <input type="text" placeholder="輸入後按 Enter 加入" data-tag-input="fandom">
                </div>
            </div>
            <div class="tag-field" data-type="relationship">
                <div class="tag-field-header">
                    <label>Relationships</label>
                    <span>Ex: Steve/Tony</span>
                </div>
                <div class="tag-input">
                    <div class="tag-chip-list" id="tags-relationship"></div>
                    <input type="text" placeholder="Ship、友情或羈絆" data-tag-input="relationship">
                </div>
            </div>
            <div class="tag-field" data-type="characters">
                <div class="tag-field-header">
                    <label>Characters</label>
                </div>
                <div class="tag-input">
                    <div class="tag-chip-list" id="tags-characters"></div>
                    <input type="text" placeholder="主要角色名單" data-tag-input="characters">
                </div>
            </div>
            <div class="tag-field" data-type="additional">
                <div class="tag-field-header">
                    <label>Additional Tags</label>
                    <span>心情、體裁、警示</span>
                </div>
                <div class="tag-input">
                    <div class="tag-chip-list" id="tags-additional"></div>
                    <input type="text" placeholder="如 Hurt/Comfort、Slow Burn、Alternate Universe" data-tag-input="additional">
                </div>
            </div>
        </section>

        <section class="editor-card" aria-label="內文編輯器">
            <div class="toolbar" id="format-toolbar">
                <button type="button" data-format="bold" title="粗體 ( **text** )">B</button>
                <button type="button" data-format="italic" title="斜體 ( *text* )">I</button>
                <button type="button" data-format="highlight" title="螢光 ( ==text== )">HL</button>
                <button type="button" data-format="blockquote" title="> 引言">❝</button>
                <button type="button" data-format="heading" title="章節小標 ( ### )">H3</button>
            </div>
            <textarea id="work-body" rows="12" placeholder="使用 Markdown 語法：**粗體**、*斜體*、> 引言、==標記==..."></textarea>
            <div class="editor-footer">
                <div id="body-stats">0 words · 0 chars</div>
                <div class="generator-controls">
                    <button id="ai-generate-ao3-btn" style="background: #990000; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;">AI 生成同人文</button>
                </div>
                <div class="generator-controls">
                    <label>氛圍
                        <select id="mood-select">
                            <option value="fluff">Fluff</option>
                            <option value="angst">Angst</option>
                            <option value="action">Action</option>
                            <option value="hurt">Hurt/Comfort</option>
                        </select>
                    </label>
                    <button type="button" id="generate-snippet">產生段落</button>
                    <button type="button" id="save-draft">儲存草稿</button>
                    <span id="composer-status" class="composer-status" aria-live="polite"></span>
                </div>
            </div>
        </section>

        <section class="preview-card" aria-label="即時預覽">
            <div class="preview-header">
                <h3 id="preview-title">未命名作品</h3>
                <p id="preview-meta">General Audiences · English</p>
            </div>
            <p class="preview-summary" id="preview-summary">輸入摘要後會顯示於此。</p>
            <div class="preview-notes" id="preview-notes"></div>
            <div class="preview-body" id="work-preview">開始書寫或使用內容產生器，即可看到行動版 AO3 的排版效果。</div>
        </section>

        <section class="draft-card" aria-label="草稿管理">
            <div class="draft-header">
                <h3>我的草稿</h3>
                <button type="button" class="ghost-btn" id="clear-drafts">清除全部</button>
            </div>
            <ul class="draft-list" id="draft-list"></ul>
        </section>
    </div>

    <script src="../scripts/shared-settings.js"></script>
    <script src="../scripts/app-appearance-settings.js"></script>
    <script src="ao3.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof SxAppAppearance !== 'undefined') {
            SxAppAppearance.initAppearanceForApp('ao3');
            var appearanceBtn = document.getElementById('menu-appearance');
            if (appearanceBtn) {
                appearanceBtn.addEventListener('click', function() {
                    var dropdown = document.getElementById('ao3-menu-dropdown');
                    if (dropdown) dropdown.classList.add('hidden');
                    SxAppAppearance.openAppearancePanel('ao3', document.body, function() {
                        var panel = document.getElementById('sx-app-appearance-panel');
                        if (panel) panel.remove();
                    });
                });
            }
        }
    });
    </script>
</body>
</html>
