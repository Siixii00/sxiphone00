<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>場景編輯器</title>
  <link rel="stylesheet" href="scene-editor.css">
  <script src="../scripts/sx-storage.js"></script>
  <script src="../scripts/localStorage-mirror.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="editor-container">
    <div class="editor-topbar">
      <button class="topbar-back" onclick="closeEditor()" aria-label="返回">
        <i data-lucide="arrow-left"></i>
        <span>返回</span>
      </button>
      <div class="topbar-title">場景編輯器</div>
    </div>

    <!-- 頂部工具列 -->
    <div class="toolbar">
      <button class="tool-btn" onclick="saveScene()">
        <i data-lucide="save"></i>
        <span>儲存</span>
      </button>
      <button class="tool-btn" onclick="loadScene()">
        <i data-lucide="folder-open"></i>
        <span>載入</span>
      </button>
      <button class="tool-btn" onclick="exportScene()">
        <i data-lucide="download"></i>
        <span>匯出</span>
      </button>
      <button class="tool-btn" onclick="clearScene()">
        <i data-lucide="trash-2"></i>
        <span>清空</span>
      </button>
      <button class="tool-btn" onclick="testScene()">
        <i data-lucide="play"></i>
        <span>測試</span>
      </button>
      <button class="tool-btn" onclick="closeEditor()">
        <i data-lucide="x"></i>
        <span>關閉</span>
      </button>
    </div>

    <div class="editor-main">
      <!-- 左側面板 - 素材庫 -->
      <div class="left-panel">
        <div class="panel-tabs">
          <button class="tab-btn active" data-tab="assets">素材</button>
          <button class="tab-btn" data-tab="layers">圖層</button>
          <button class="tab-btn" data-tab="sprites">角色</button>
        </div>

        <!-- 素材標籤 -->
        <div class="tab-content" id="assets-tab">
          <div class="asset-section">
            <h3>Tileset</h3>
            <div id="tileset-container"></div>
          </div>

          <div class="asset-section">
            <h3>背景</h3>
            <button class="upload-btn" onclick="uploadAsset('background')">
              <i data-lucide="upload"></i> 上傳背景
            </button>
            <div class="asset-grid" id="background-assets"></div>
          </div>

          <div class="asset-section">
            <h3>物件</h3>
            <button class="upload-btn" onclick="uploadAsset('object')">
              <i data-lucide="upload"></i> 上傳物件
            </button>
            <div class="asset-grid" id="object-assets"></div>
          </div>

          <div class="asset-section">
            <h3>內建素材</h3>
            <button class="info-btn" onclick="window.open('asset-guide.html', '_blank')">
              <i data-lucide="help-circle"></i> 素材使用指南
            </button>
            <div class="builtin-assets asset-grid" id="builtin-assets"></div>
          </div>

          <div class="assets-footer">
            <div class="asset-preview" id="asset-preview">
              <h3>素材預覽</h3>
              <div class="asset-preview-empty">尚未選擇素材</div>
            </div>
            <div class="layer-move-card">
              <h3>圖層移動</h3>
              <div class="layer-move-row" id="layer-move-status">目前圖層：物件層</div>
              <div class="layer-move-actions">
                <button class="tool-btn" onclick="moveActiveLayer(-1)">
                  <i data-lucide="arrow-up"></i>
                  <span>上移</span>
                </button>
                <button class="tool-btn" onclick="moveActiveLayer(1)">
                  <i data-lucide="arrow-down"></i>
                  <span>下移</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 圖層標籤 -->
        <div class="tab-content hidden" id="layers-tab">
          <div class="layers-list" id="layers-list"></div>
          <button class="add-layer-btn" onclick="addLayer()">
            <i data-lucide="plus"></i> 新增圖層
          </button>
          
          <div class="anim-tiles-section">
            <h3>動畫 Tiles</h3>
            <button class="add-layer-btn" onclick="createAnimatedTile()">
              <i data-lucide="video"></i> 創建動畫 Tile
            </button>
            <div id="animated-tiles-list"></div>
          </div>
        </div>

        <!-- 角色標籤 -->
        <div class="tab-content hidden" id="sprites-tab">
          <div class="sprite-tools">
            <button class="sprite-btn" onclick="openSpriteGenerator()">
              <i data-lucide="image"></i>
              從照片生成
            </button>
            <button class="sprite-btn" onclick="openPixelEditor()">
              <i data-lucide="pen-tool"></i>
              像素繪圖
            </button>
          </div>
          <div class="sprite-list" id="sprite-list"></div>
        </div>
      </div>

      <!-- 中央畫布 -->
      <div class="canvas-area">
        <div class="canvas-toolbar">
          <button class="canvas-tool active" data-tool="pen" title="畫筆">
            <i data-lucide="pen-tool"></i>
          </button>
          <button class="canvas-tool" data-tool="erase" title="橡皮擦">
            <i data-lucide="eraser"></i>
          </button>
          <button class="canvas-tool" data-tool="fill" title="填充">
            <i data-lucide="paint-bucket"></i>
          </button>
          <button class="canvas-tool" data-tool="eyedropper" title="吸管">
            <i data-lucide="pipette"></i>
          </button>
          <button class="canvas-tool" onclick="toggleFlipX()" title="水平翻轉">
            <i data-lucide="flip-horizontal"></i>
          </button>
          <button class="canvas-tool" onclick="toggleFlipY()" title="垂直翻轉">
            <i data-lucide="flip-vertical"></i>
          </button>
          <div class="toolbar-separator"></div>
          <button class="canvas-tool" onclick="undo()" title="復原">
            <i data-lucide="undo"></i>
          </button>
          <button class="canvas-tool" onclick="redo()" title="重做">
            <i data-lucide="redo"></i>
          </button>
          <button class="canvas-tool" onclick="toggleGrid()" title="網格">
            <i data-lucide="grid"></i>
          </button>
          <div class="zoom-controls">
            <button onclick="zoomOut()"><i data-lucide="zoom-out"></i></button>
            <span id="zoom-level">100%</span>
            <button onclick="zoomIn()"><i data-lucide="zoom-in"></i></button>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="scene-canvas" width="800" height="600"></canvas>
          <div class="grid-overlay" id="grid-overlay"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- 角色精靈生成器彈窗 -->
  <div class="modal hidden" id="sprite-generator-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>角色精靈生成器</h2>
        <button onclick="closeSpriteGenerator()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="generator-steps">
          <div class="step active" data-step="1">
            <h3>1. 上傳照片</h3>
            <input type="file" id="sprite-photo" accept="image/*" onchange="loadSpritePhoto(event)">
            <div class="photo-preview" id="photo-preview"></div>
          </div>
          <div class="step" data-step="2">
            <h3>2. 調整參數</h3>
            <div class="param-group">
              <label>像素化程度</label>
              <input type="range" id="pixelation" min="8" max="64" value="32" oninput="updateSpritePreview()">
            </div>
            <div class="param-group">
              <label>色彩數量</label>
              <input type="range" id="color-count" min="4" max="32" value="16" oninput="updateSpritePreview()">
            </div>
            <div class="param-group">
              <label>對比度</label>
              <input type="range" id="contrast" min="0" max="200" value="100" oninput="updateSpritePreview()">
            </div>
          </div>
          <div class="step" data-step="3">
            <h3>3. 預覽與生成</h3>
            <canvas id="sprite-preview" width="128" height="128"></canvas>
            <div class="direction-previews">
              <div class="direction-item">
                <span>↑ 上</span>
                <canvas class="dir-canvas" data-dir="up"></canvas>
              </div>
              <div class="direction-item">
                <span>↓ 下</span>
                <canvas class="dir-canvas" data-dir="down"></canvas>
              </div>
              <div class="direction-item">
                <span>← 左</span>
                <canvas class="dir-canvas" data-dir="left"></canvas>
              </div>
              <div class="direction-item">
                <span>→ 右</span>
                <canvas class="dir-canvas" data-dir="right"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button onclick="generateSprite()">生成角色</button>
          <button onclick="closeSpriteGenerator()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 像素編輯器彈窗 -->
  <div class="modal hidden" id="pixel-editor-modal">
    <div class="modal-content large">
      <div class="modal-header">
        <h2>像素繪圖編輯器</h2>
        <button onclick="closePixelEditor()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="pixel-editor">
          <div class="pixel-toolbar">
            <button class="pixel-tool active" data-tool="pen">
              <i data-lucide="pen-tool"></i>
            </button>
            <button class="pixel-tool" data-tool="eraser">
              <i data-lucide="eraser"></i>
            </button>
            <button class="pixel-tool" data-tool="fill">
              <i data-lucide="paint-bucket"></i>
            </button>
            <button class="pixel-tool" data-tool="eyedropper">
              <i data-lucide="pipette"></i>
            </button>
            <div class="color-picker">
              <input type="color" id="pixel-color" value="#000000">
            </div>
          </div>
          <div class="pixel-canvas-wrapper">
            <canvas id="pixel-canvas" width="320" height="320"></canvas>
          </div>
          <div class="pixel-palette">
            <h4>調色盤</h4>
            <div class="palette-grid" id="palette-grid"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button onclick="savePixelSprite()">儲存</button>
          <button onclick="clearPixelCanvas()">清空</button>
          <button onclick="closePixelEditor()">取消</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="asset-upload" accept="image/*" style="display:none" onchange="handleAssetUpload(event)">
  <input type="file" id="scene-import" accept=".json" style="display:none" onchange="handleSceneImport(event)">

  <script src="builtin-assets.js"></script>
  <script src="scene-editor.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
