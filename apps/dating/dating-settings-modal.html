<!-- 約會設定彈窗 -->
<div class="dating-settings-modal hidden" id="dating-settings-modal">
  <div class="dating-settings-content">
    <div class="dating-settings-header">
      <h2>約會設定</h2>
      <button class="close-btn" onclick="closeDatingSettings()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="dating-settings-body">
      <div class="settings-tabs">
        <button class="settings-tab active" data-tab="general" onclick="switchSettingsTab('general')">
          <i data-lucide="sliders"></i>
          <span>一般設定</span>
        </button>
        <button class="settings-tab" data-tab="scene" onclick="switchSettingsTab('scene')">
          <i data-lucide="map"></i>
          <span>場景編輯</span>
        </button>
        <button class="settings-tab" data-tab="help" onclick="switchSettingsTab('help')">
          <i data-lucide="help-circle"></i>
          <span>操作說明</span>
        </button>
      </div>

      <div class="settings-content">
        <!-- 一般設定 -->
        <div class="settings-panel active" id="general-panel">
          <div class="setting-item">
            <h3>時間控制</h3>
            <div class="time-controls-compact">
              <button class="control-btn-compact" onclick="pauseTime()">
                <i data-lucide="pause"></i>
              </button>
              <button class="control-btn-compact" onclick="resumeTime()">
                <i data-lucide="play"></i>
              </button>
              <button class="control-btn-compact" onclick="resetTime()">
                <i data-lucide="rotate-ccw"></i>
              </button>
            </div>
          </div>

          <div class="setting-item">
            <h3>時間流速</h3>
            <div class="speed-selector-compact">
              <button class="speed-btn-compact" onclick="setTimeSpeed(0.5)">0.5x</button>
              <button class="speed-btn-compact active" onclick="setTimeSpeed(1)">1x</button>
              <button class="speed-btn-compact" onclick="setTimeSpeed(2)">2x</button>
              <button class="speed-btn-compact" onclick="setTimeSpeed(5)">5x</button>
            </div>
          </div>

          <div class="setting-item">
            <h3>當前時間</h3>
            <div class="time-display-large" id="settings-time-display">
              第1天 09:00
            </div>
          </div>
        </div>

        <!-- 場景編輯 -->
        <div class="settings-panel" id="scene-panel">
          <div class="setting-item">
            <p>點擊下方按鈕開啟場景編輯器</p>
            <button class="action-btn" onclick="openSceneEditorFromSettings()">
              <i data-lucide="edit"></i>
              開啟場景編輯器
            </button>
          </div>
        </div>

        <!-- 操作說明 -->
        <div class="settings-panel" id="help-panel">
          <div class="help-section-compact">
            <h3>🎮 移動控制</h3>
            <ul>
              <li>使用 WASD 或方向鍵移動角色</li>
              <li>點擊螢幕右下角的虛擬搖桿</li>
            </ul>
          </div>
          <div class="help-section-compact">
            <h3>💬 互動系統</h3>
            <ul>
              <li>靠近角色時按 E 鍵互動</li>
              <li>點擊螢幕上的互動按鈕</li>
            </ul>
          </div>
          <div class="help-section-compact">
            <h3>⏰ 時間系統</h3>
            <ul>
              <li>可設定約會天數（1-365天）</li>
              <li>調整時間流速（0.5x-5x）</li>
              <li>隨時暫停或調整時間</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
