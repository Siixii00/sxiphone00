<!-- 時間設定彈窗 -->
<div class="time-settings-modal hidden" id="time-settings-modal">
  <div class="time-settings-content">
    <div class="time-settings-header">
      <h2>約會時間設定</h2>
      <button class="close-btn" onclick="closeTimeSettings()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="time-settings-body">
      <div class="setting-group">
        <label>約會天數</label>
        <div class="day-selector">
          <button class="day-btn" onclick="setDays(1)">1天</button>
          <button class="day-btn active" onclick="setDays(3)">3天</button>
          <button class="day-btn" onclick="setDays(7)">7天</button>
          <button class="day-btn" onclick="setDays(14)">14天</button>
        </div>
        <div class="custom-days">
          <input type="number" id="custom-days" min="1" max="365" placeholder="自訂天數">
          <button onclick="setCustomDays()">確定</button>
        </div>
      </div>

      <div class="setting-group">
        <label>時間流速</label>
        <div class="speed-selector">
          <button class="speed-btn" onclick="setTimeSpeed(0.5)">慢速 (0.5x)</button>
          <button class="speed-btn active" onclick="setTimeSpeed(1)">正常 (1x)</button>
          <button class="speed-btn" onclick="setTimeSpeed(2)">快速 (2x)</button>
          <button class="speed-btn" onclick="setTimeSpeed(5)">極速 (5x)</button>
        </div>
      </div>

      <div class="setting-group">
        <label>當前時間</label>
        <div class="time-adjuster">
          <div class="time-input-group">
            <label>第</label>
            <input type="number" id="current-day-input" min="1" value="1">
            <label>天</label>
          </div>
          <div class="time-input-group">
            <input type="number" id="current-hour-input" min="0" max="23" value="9">
            <label>:</label>
            <input type="number" id="current-minute-input" min="0" max="59" value="0">
          </div>
          <button class="apply-time-btn" onclick="applyTimeChange()">套用</button>
        </div>
      </div>

      <div class="setting-group">
        <label>時間控制</label>
        <div class="time-controls">
          <button class="control-btn" onclick="pauseTime()">
            <i data-lucide="pause"></i> 暫停
          </button>
          <button class="control-btn" onclick="resumeTime()">
            <i data-lucide="play"></i> 繼續
          </button>
          <button class="control-btn" onclick="resetTime()">
            <i data-lucide="rotate-ccw"></i> 重置
          </button>
        </div>
      </div>

      <div class="time-info">
        <h3>時間說明</h3>
        <ul>
          <li>約會將在設定的天數後自動結束</li>
          <li>時間流速影響遊戲內時間的快慢</li>
          <li>可以隨時調整當前時間</li>
          <li>暫停時間不會影響遊戲進行</li>
        </ul>
      </div>
    </div>
  </div>
</div>
